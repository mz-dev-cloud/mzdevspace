<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grupos · MzDevSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --surface:#0c0c0e;
    --surface-2:#131316;
    --border:#1e1e22;
    --text:#f4f4f6;
    --muted:#8b8b93;
    --accent:#9b5cff;
    --accent-2:#c6ff3d;
    --radius:16px;
    --amizade:#4ea1ff;
    --vendas:#ffb020;
    --games:#ff4d6d;
    --namoro:#ff5ca8;
    --maiores:#ff3b3b;
    --devs:#34d399;
    --figurinhas:#c084fc;
    --outros:#9ca3af;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
  }
  ::selection{background:var(--accent);color:#000;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:236px;
    flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    padding:28px 18px;
    display:flex;
    flex-direction:column;
    gap:28px;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    font-family:'Unbounded',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:-0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px var(--accent);
  }
  .nav{display:flex;flex-direction:column;gap:4px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    color:var(--muted);font-size:14px;font-weight:500;
    cursor:pointer;border:1px solid transparent;
    transition:.15s ease;
    background:none;
    text-align:left;
    width:100%;
  }
  .nav-item:hover{color:var(--text);background:var(--surface-2);}
  .nav-item.active{color:var(--text);background:var(--surface-2);border-color:var(--border);}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}

  .send-btn{
    margin-top:auto;
    background:var(--accent);
    color:#fff;
    border:none;
    padding:13px 16px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:.15s ease;
  }
  .send-btn:hover{filter:brightness(1.12);transform:translateY(-1px);}

  /* ---------- MAIN ---------- */
  main{flex:1;padding:36px 40px 80px;max-width:1240px;}
  .top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  h1{
    font-family:'Unbounded',sans-serif;
    font-size:30px;
    margin:0 0 6px;
    letter-spacing:-0.02em;
  }
  .sub{color:var(--muted);font-size:14px;margin:0;}

  .filters{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:30px;
  }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--muted);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:.15s ease;
    display:flex;align-items:center;gap:6px;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
  .chip:hover{color:var(--text);border-color:#333;}
  .chip.active{background:var(--text);color:#000;border-color:var(--text);}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(266px,1fr));
    gap:20px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:.2s ease;
  }
  .card:hover{border-color:#333;transform:translateY(-2px);}
  .card-img{
    height:140px;
    background-size:cover;
    background-position:center;
    background-color:var(--surface-2);
    position:relative;
  }
  .cat-pill{
    position:absolute;
    top:10px;left:10px;
    padding:4px 10px;
    border-radius:999px;
    font-size:11px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#000;
    backdrop-filter:blur(6px);
  }
  .card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .card-title{font-weight:700;font-size:15px;margin:0;}
  .card-desc{
    color:var(--muted);
    font-size:13px;
    line-height:1.45;
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1;
  }
  .join-btn{
    margin-top:6px;
    display:block;
    text-align:center;
    text-decoration:none;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-weight:700;
    font-size:13px;
    padding:10px;
    border-radius:10px;
    transition:.15s ease;
  }
  .join-btn:hover{background:var(--accent);border-color:var(--accent);color:#fff;}

  .empty{
    color:var(--muted);
    font-size:14px;
    padding:60px 0;
    text-align:center;
    grid-column:1/-1;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    width:100%;max-width:460px;
    padding:28px;
    max-height:90vh;
    overflow-y:auto;
  }
  .modal h2{
    font-family:'Unbounded',sans-serif;
    font-size:19px;
    margin:0 0 4px;
  }
  .modal .sub{margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 12px;
    border-radius:10px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    transition:.15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field textarea{resize:vertical;min-height:80px;}
  .char-count{font-size:11px;color:var(--muted);text-align:right;margin-top:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .btn-secondary{
    flex:1;background:none;border:1px solid var(--border);color:var(--muted);
    padding:12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;
  }
  .btn-primary{
    flex:2;background:var(--accent);border:none;color:#fff;
    padding:12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14px;
  }
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .form-msg{font-size:13px;margin-top:14px;padding:10px 12px;border-radius:10px;display:none;}
  .form-msg.ok{display:block;background:rgba(52,211,153,.12);color:#34d399;border:1px solid rgba(52,211,153,.3);}
  .form-msg.err{display:block;background:rgba(255,77,109,.12);color:#ff4d6d;border:1px solid rgba(255,77,109,.3);}

  @media(max-width:820px){
    body{flex-direction:column;}
    .sidebar{
      width:100%;height:auto;position:relative;
      flex-direction:row;align-items:center;
      overflow-x:auto;padding:14px 16px;gap:16px;
    }
    .nav{flex-direction:row;}
    .send-btn{margin:0;white-space:nowrap;}
    main{padding:24px 18px 60px;}
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand"><span class="dot"></span>Grupos</div>
  <nav class="nav">
    <button class="nav-item active" data-cat="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      Todos os grupos
    </button>
  </nav>
  <button class="send-btn" id="openModalBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    Enviar seu grupo
  </button>

<a class="send-btn" id="voltarHomeBtn" href="https://mz-dev-cloud.github.io/mzdevspace/index.html">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
  Voltar à página inicial
</a>

<a class="send-btn" id="denunciarBtn" href="https://wa.me/553171917951?text=quero%20denunciar%20um%20grupo%20que%20esta%20hospedado%20em%20seu%20site%20%2C%20aqui%20as%20provas">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
  Denunciar grupo
</a>
</aside>

<main>
  <div class="top">
    <div>
      <h1>Explore grupos</h1>
      <p class="sub">Grupos enviados pela comunidade, revisados antes de entrar no ar.</p>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="grid" id="grid">
    <p class="empty">Carregando grupos...</p>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Enviar seu grupo</h2>
    <p class="sub">Depois de enviado, seu grupo passa por revisão antes de aparecer no site.</p>
    <form id="groupForm">
      <div class="field">
        <label>Nome do grupo</label>
        <input type="text" id="nome_grupo" maxlength="60" required placeholder="Ex: Devs Brasil" />
      </div>
      <div class="field">
        <label>Link do grupo</label>
        <input type="url" id="link_grupo" required placeholder="https://chat.whatsapp.com/..." />
      </div>
      <div class="field">
        <label>Link da imagem do grupo</label>
        <input type="url" id="image_url" required placeholder="https://..." />
      </div>
      <div class="field">
        <label>Categoria</label>
        <select id="category" required>
          <option value="" disabled selected>Selecione</option>
          <option value="amizade">Amizade</option>
          <option value="vendas">Vendas</option>
          <option value="games">Games</option>
          <option value="namoro">Namoro</option>
          <option value="+18">Maiores de 18</option>
          <option value="devs">Devs</option>
          <option value="figurinhas">Figurinhas</option>
          <option value="outros">Outros</option>
        </select>
      </div>
      <div class="field">
        <label>Descrição</label>
        <textarea id="description" maxlength="200" required placeholder="Fale um pouco sobre o grupo..."></textarea>
        <div class="char-count"><span id="charCount">0</span>/200</div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="closeModalBtn">Cancelar</button>
        <button type="submit" class="btn-primary" id="submitBtn">Enviar para revisão</button>
      </div>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
  const SUPABASE_URL = "https://fzrsoydztbljlqlcdlhr.supabase.co";
  const SUPABASE_KEY = "sb_publishable_H3Gkk6LY4TnQx6gePO18Og_ZL_YxJpJ";
  const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CATEGORIES = [
    { value:"amizade",    label:"Amizade",        color:"var(--amizade)" },
    { value:"vendas",     label:"Vendas",         color:"var(--vendas)" },
    { value:"games",      label:"Games",          color:"var(--games)" },
    { value:"namoro",     label:"Namoro",         color:"var(--namoro)" },
    { value:"+18",        label:"+18",            color:"var(--maiores)" },
    { value:"devs",       label:"Devs",           color:"var(--devs)" },
    { value:"figurinhas", label:"Figurinhas",     color:"var(--figurinhas)" },
    { value:"outros",     label:"Outros",         color:"var(--outros)" },
  ];

  let allGroups = [];
  let activeCat = "";

  function catInfo(value){
    return CATEGORIES.find(c => c.value === value) || { label:value, color:"var(--outros)" };
  }

  function renderFilters(){
    const wrap = document.getElementById("filters");
    wrap.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip active";
    allChip.textContent = "Todos";
    allChip.onclick = () => setActive("", allChip);
    wrap.appendChild(allChip);

    CATEGORIES.forEach(c => {
      const chip = document.createElement("button");
      chip.className = "chip";
      chip.style.color = c.color;
      chip.innerHTML = `<span class="dot"></span>${c.label}`;
      chip.onclick = () => setActive(c.value, chip);
      wrap.appendChild(chip);
    });
  }

  function setActive(cat, el){
    activeCat = cat;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
    el.classList.add("active");
    renderGrid();
  }

  function renderGrid(){
    const grid = document.getElementById("grid");
    const list = activeCat ? allGroups.filter(g => g.category === activeCat) : allGroups;
    if(!list.length){
      grid.innerHTML = `<p class="empty">Nenhum grupo aprovado aqui ainda. Seja o primeiro a enviar um!</p>`;
      return;
    }
    grid.innerHTML = list.map(g => {
      const c = catInfo(g.category);
      return `
        <div class="card">
          <div class="card-img" style="background-image:url('${g.image_url}')">
            <span class="cat-pill" style="background:${c.color}">${c.label}</span>
          </div>
          <div class="card-body">
            <p class="card-title">${escapeHtml(g.nome_grupo)}</p>
            <p class="card-desc">${escapeHtml(g.description)}</p>
            <a class="join-btn" href="${g.link_grupo}" target="_blank" rel="noopener noreferrer">Entrar no grupo</a>
          </div>
        </div>`;
    }).join("");
  }

  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  async function loadGroups(){
    const { data, error } = await supa
      .from("grupos")
      .select("*")
      .eq("status", "aprovado")
      .order("created_at", { ascending:false });
    if(error){
      document.getElementById("grid").innerHTML = `<p class="empty">Erro ao carregar grupos.</p>`;
      console.error(error);
      return;
    }
    allGroups = data;
    renderGrid();
  }

  renderFilters();
  loadGroups();

  // ---------- modal ----------
  const overlay = document.getElementById("overlay");
  document.getElementById("openModalBtn").onclick = () => overlay.classList.add("open");
  document.getElementById("closeModalBtn").onclick = () => overlay.classList.remove("open");
  overlay.addEventListener("click", e => { if(e.target === overlay) overlay.classList.remove("open"); });

  const descEl = document.getElementById("description");
  const charCount = document.getElementById("charCount");
  descEl.addEventListener("input", () => charCount.textContent = descEl.value.length);

  const form = document.getElementById("groupForm");
  const submitBtn = document.getElementById("submitBtn");
  const formMsg = document.getElementById("formMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    formMsg.className = "form-msg";
    submitBtn.disabled = true;
    submitBtn.textContent = "Enviando...";

    const payload = {
      nome_grupo: document.getElementById("nome_grupo").value.trim(),
      link_grupo: document.getElementById("link_grupo").value.trim(),
      image_url: document.getElementById("image_url").value.trim(),
      description: descEl.value.trim(),
      category: document.getElementById("category").value,
      status: "pendente"
    };

    const { error } = await supa.from("grupos").insert(payload);

    if(error){
      formMsg.textContent = "Não deu pra enviar agora. Confere os campos e tenta de novo.";
      formMsg.classList.add("err");
      console.error(error);
    } else {
      formMsg.textContent = "Enviado! Seu grupo entra no ar assim que for aprovado.";
      formMsg.classList.add("ok");
      form.reset();
      charCount.textContent = "0";
      setTimeout(() => {
        overlay.classList.remove("open");
        formMsg.className = "form-msg";
      }, 2200);
    }
    submitBtn.disabled = false;
    submitBtn.textContent = "Enviar para revisão";
  });
</script>
</body>
</html>
